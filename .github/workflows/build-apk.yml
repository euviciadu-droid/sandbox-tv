name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build do Sandbox APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v3

      - name: Configurar o Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x ./gradlew

      - name: Compilar o APK (Release)
        run: ./gradlew assembleRelease

      - name: Salvar o APK gerado no GitHub
        uses: actions/upload-artifact@v3
        with:
          name: sandbox-app-release
          path: app/build/outputs/apk/release/*.apk
