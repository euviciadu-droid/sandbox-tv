name: Compilar APK REPL4Y

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Compilar APK
        run: |
          # Procura a pasta onde estao os arquivos do Gradle
          GRADLE_DIR=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then GRADLE_DIR="."; fi
          
          cd "$GRADLE_DIR"
          echo "Compilando na pasta: $GRADLE_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Disponibilizar Link de Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: REPL4Y-TV-Instalador
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
