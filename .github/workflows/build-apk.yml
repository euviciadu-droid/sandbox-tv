name: Compilar APK REPL4Y

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permissao de execucao no Gradle
        run: chmod +x gradlew || true

      - name: Gerar APK de Instalacao
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar Link de Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: REPL4Y-TV-Instalador
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
