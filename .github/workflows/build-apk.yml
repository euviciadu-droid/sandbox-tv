name: Compilar APK REPL4Y

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Localizar Modulo e Compilar APK
        run: |
          echo "=== Estrutura de arquivos no repositorio ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # Procura onde esta o build.gradle que aplica o plugin android
          APP_GRADLE=$(grep -rl "com.android.application" . --include="build.gradle*" | head -n 1)

          if [ -n "$APP_GRADLE" ]; then
            MODULE_DIR=$(dirname "$APP_GRADLE")
            MODULE_NAME=$(basename "$MODULE_DIR")
            ROOT_DIR=$(dirname "$MODULE_DIR")
            
            echo "Modulo Android detectado em: $MODULE_DIR (Nome: $MODULE_NAME)"
            
            # Se o modulo estiver na raiz direta (ex: ./app)
            if [ "$ROOT_DIR" = "." ]; then
              echo "include ':$MODULE_NAME'" > settings.gradle
              gradle :$MODULE_NAME:assembleDebug --no-daemon --stacktrace
            else
              # Se o projeto inteiro estiver dentro de uma subpasta (ex: ./prona2/app)
              cd "$ROOT_DIR"
              echo "include ':$MODULE_NAME'" > settings.gradle
              gradle :$MODULE_NAME:assembleDebug --no-daemon --stacktrace
            fi
          else
            echo "Tentando compilacao generica..."
            gradle assembleDebug --no-daemon --stacktrace || gradle assemble --no-daemon --stacktrace
          fi

      - name: Disponibilizar Link de Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: REPL4Y-TV-Instalador
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 14
