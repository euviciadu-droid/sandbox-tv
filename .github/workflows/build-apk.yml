name: Compilar APK REPL4Y

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle no Runner (caso nao tenha wrapper)
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Disponibilizar Link de Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: REPL4Y-TV-Instalador
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
